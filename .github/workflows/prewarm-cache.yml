name: Pre-warm OSM Facilities Cache

on:
  schedule:
    # Berjalan otomatis setiap Senin dini hari jam 02:00 WIB (Minggu 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch: # Agar dapat dijalankan manual kapan saja dari tab GitHub Actions

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Pre-warm OSM Cache Script
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run prewarm-osm
