name: Pre-warm OSM Facilities Cache

on:
  schedule:
    # Berjalan otomatis setiap tanggal 1 awal bulan jam 01:00 UTC (~08:00 WIB)
    - cron: '0 1 1 * *'
  workflow_dispatch: # Agar dapat dijalankan manual kapan saja dari tab GitHub Actions

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Pre-warm OSM Cache Script
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://urezyxwovgycpzcfvwko.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'your-supabase-service-role-key' }}
        run: npm run prewarm-osm
