name: Database Backup

on:
  schedule:
    # Berjalan setiap Minggu jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Backup Supabase Database
        env:
          # Pastikan Anda menambahkan DATABASE_URL ke GitHub Secrets Anda!
          # Formatnya bisa didapat di Supabase Dashboard -> Project Settings -> Database -> Connection string (URI)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set!"
            exit 1
          fi
          
          # Membuat nama file dengan timestamp
          BACKUP_FILE="jakscope-backup-$(date +'%Y-%m-%d').sql"
          
          echo "Memulai proses backup database..."
          pg_dump "$DATABASE_URL" --clean --if-exists --no-owner --no-privileges > "$BACKUP_FILE"
          echo "Backup selesai! Ukuran file:"
          ls -lh "$BACKUP_FILE"

      - name: Upload Backup to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: '*.sql'
          retention-days: 90 # Simpan di GitHub selama 90 hari
